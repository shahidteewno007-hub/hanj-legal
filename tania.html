<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>For Tania ✦</title>
<meta property="og:title" content="For you, Tania ✦">
<meta property="og:description" content="A letter in ten moments.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Lora:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background:#0d0906; -webkit-tap-highlight-color: transparent; }

  @keyframes petalFall {
    0%   { transform: translateY(-20px) rotate(0deg) translateX(0px); opacity: 0; }
    10%  { opacity: 0.9; }
    90%  { opacity: 0.4; }
    100% { transform: translateY(110vh) rotate(380deg) translateX(35px); opacity: 0; }
  }
  @keyframes fadeUp { from { opacity:0; transform:translateY(14px); } to { opacity:1; transform:translateY(0); } }
  @keyframes shimmer { 0% { background-position:-200% center; } 100% { background-position:200% center; } }
  @keyframes breathe { 0%,100% { transform:scale(1); opacity:0.65; } 50% { transform:scale(1.06); opacity:1; } }
  @keyframes blink { 0%,100% { opacity:1; } 50% { opacity:0; } }

  .wrapper { min-height:100vh; background:#0d0906; color:#f0e6d6; font-family:'Lora',serif; position:relative; overflow-x:hidden; }
  .glow-top { position:fixed; top:-15vh; left:50%; transform:translateX(-50%); width:560px; height:560px;
    background:radial-gradient(ellipse, rgba(185,85,30,0.07) 0%, transparent 70%); pointer-events:none; z-index:0; }
  .glow-btm { position:fixed; bottom:-20vh; right:-8vw; width:380px; height:380px;
    background:radial-gradient(ellipse, rgba(110,55,15,0.06) 0%, transparent 70%); pointer-events:none; z-index:0; }
  .petal { position:fixed; width:6px; height:10px; border-radius:50% 0 50% 0; background:rgba(255,180,130,0.15); pointer-events:none; top:-20px; z-index:0; }

  /* INTRO */
  .intro { position:relative; z-index:2; min-height:100vh; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center; padding:48px 24px; }
  .intro-star { font-size:34px; margin-bottom:28px; animation:breathe 3.2s ease-in-out infinite; filter:sepia(0.4); }
  .intro-title { font-family:'Cormorant Garamond',serif; font-weight:300; font-style:italic;
    font-size:clamp(30px,7vw,56px); color:#f5e8d0; line-height:1.18; letter-spacing:0.02em; margin-bottom:10px; }
  .intro-name { font-family:'Cormorant Garamond',serif; font-weight:400; font-size:clamp(26px,5.5vw,46px);
    color:#e8b870; letter-spacing:0.06em; margin-bottom:40px; }
  .intro-sub { font-size:11px; letter-spacing:0.28em; text-transform:uppercase; color:rgba(240,230,210,0.35); margin-bottom:52px; }
  .begin-btn { background:none; border:1px solid rgba(210,150,80,0.35); color:#ddb870; font-family:'Lora',serif;
    font-size:13px; letter-spacing:0.22em; text-transform:uppercase; padding:14px 44px; cursor:pointer;
    position:relative; overflow:hidden; transition:border-color .35s,color .35s,background .35s; }
  .begin-btn::before { content:''; position:absolute; inset:0;
    background:linear-gradient(90deg, transparent, rgba(210,150,80,0.1), transparent); background-size:200% 100%; animation:shimmer 2.6s linear infinite; }
  .begin-btn:active { border-color:rgba(210,150,80,0.65); color:#f5d898; background:rgba(210,150,80,0.04); }

  /* MAIN */
  .main { display:flex; min-height:100vh; position:relative; z-index:2; }
  .sidebar { width:210px; min-width:150px; padding:64px 18px 48px 28px; border-right:1px solid rgba(210,150,80,0.1);
    position:sticky; top:0; height:100vh; overflow-y:auto; display:flex; flex-direction:column; gap:2px; }
  .sidebar::-webkit-scrollbar { display:none; }
  .sb-label { font-size:10px; letter-spacing:0.26em; text-transform:uppercase; color:rgba(240,230,210,0.28); margin-bottom:22px; }
  .ch-row { display:flex; align-items:center; gap:11px; padding:8px 0; cursor:default; opacity:0.28; transition:opacity .3s; }
  .ch-row.open { opacity:0.52; cursor:pointer; }
  .ch-row.active { opacity:1; cursor:pointer; }
  .ch-dot { width:5px; height:5px; border-radius:50%; background:rgba(210,150,80,0.38); flex-shrink:0; transition:all .3s; }
  .ch-row.active .ch-dot { background:#c87838; width:7px; height:7px; box-shadow:0 0 8px rgba(200,120,55,0.55); }
  .ch-name { font-size:11px; letter-spacing:0.07em; color:rgba(240,230,210,0.65); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .ch-row.active .ch-name { color:#e8c080; }

  .content { flex:1; padding:clamp(48px,8vw,96px) clamp(26px,6vw,80px); max-width:680px; }
  .ch-meta { margin-bottom:38px; }
  .ch-tag { font-size:10px; letter-spacing:0.28em; text-transform:uppercase; color:#c47830; margin-bottom:14px; animation:fadeUp .55s ease both; }
  .ch-title { font-family:'Cormorant Garamond',serif; font-weight:300; font-size:clamp(24px,4.5vw,40px); color:#f5e8d0; line-height:1.15; animation:fadeUp .65s ease .08s both; }
  .ch-rule { width:38px; height:1px; margin-top:20px; background:linear-gradient(90deg, rgba(210,150,80,0.55), transparent); animation:fadeUp .55s ease .15s both; }

  .lines { display:flex; flex-direction:column; gap:16px; }
  .line { font-size:clamp(16px,2.4vw,19px); font-style:italic; line-height:1.8; color:rgba(240,230,210,0.82); animation:fadeUp .75s ease both; }
  .line.bold { font-style:normal; font-weight:400; color:#f5e8d0; font-size:clamp(17px,2.7vw,21px); }
  .line.arabic { font-family:'Cormorant Garamond',serif; font-size:clamp(24px,4.2vw,34px); font-style:normal; color:#e8b860; letter-spacing:0.04em; text-align:right; direction:rtl; }
  .line.name-highlight { font-style:normal; color:#e8b860; font-family:'Cormorant Garamond',serif; font-size:clamp(18px,3vw,24px); }
  .line.final-big { font-family:'Cormorant Garamond',serif; font-style:italic; font-weight:300; font-size:clamp(20px,3.8vw,30px); color:#f5e8d0; }
  .line.always { font-family:'Cormorant Garamond',serif; font-style:italic; font-size:clamp(22px,4vw,32px); color:#e8b860; margin-top:8px; }
  .cursor { display:inline-block; width:2px; height:1em; background:rgba(210,150,80,0.55); vertical-align:text-bottom; margin-left:2px; animation:blink 1s step-end infinite; }

  .finale { margin-top:64px; text-align:center; animation:fadeUp 1s ease both; padding-bottom:72px; }
  .finale-star { font-size:26px; display:block; margin-bottom:14px; filter:sepia(0.3); }
  .finale-sub { font-size:10px; letter-spacing:0.32em; text-transform:uppercase; color:rgba(240,230,210,0.25); }

  .mob-nav { display:none; gap:7px; flex-wrap:wrap; padding:22px 26px 0; position:relative; z-index:2; }
  .mob-dot { width:7px; height:7px; border-radius:50%; background:rgba(210,150,80,0.22); border:none; cursor:pointer; transition:all .3s; }
  .mob-dot.active { background:#c87838; width:9px; height:9px; }

  @media (max-width:620px) {
    .sidebar { display:none; }
    .mob-nav { display:flex; }
    .content { padding:36px 24px 64px; max-width:100%; }
  }
</style>
</head>
<body>
<div class="wrapper" id="app">
  <div class="glow-top"></div>
  <div class="glow-btm"></div>
</div>

<script>
const chapters = [
  { id:"november", label:"12 November", title:"A Stranger from Turkey",
    lines:["It started on Hello Talk.","A boy with a Turkish flag. A girl who spoke Sindhi.","Neither of us knew yet —","this was the beginning of something that would outlast every fight, every silence, every city between us."] },
  { id:"silence", label:"The Week of Quiet", title:"The Week I Didn't Know You",
    lines:["There was a week where I disappeared.","I didn't know your world. You didn't know if I'd come back.","You were about to press delete.","I didn't know that then.","I just know now — you didn't.","And that changed everything."] },
  { id:"snapchat", label:"The Status", title:"Don't Go After People Who Want to Leave",
    lines:["You posted a status.","I replied — agreeing with you.","You thought I was challenging you.","And from that one beautiful misunderstanding,","the conversation that was almost over became the one that never stopped.","\"Don't you know English?\" I asked.","\"Don't you know Sindhi?\" you answered.","And just like that — I was home."] },
  { id:"haazur", label:"Haazur", title:"The Word That Did It",
    lines:["You said حاضر.","Haazur.","At your service — like a vow, like a warmth, like something ancient and tender at once.","And something in me went completely still.","Not empty still.","Full still.","I knew right then.","Even before I could say it — I knew."] },
  { id:"snaps", label:"First Snaps", title:"No Way Someone Can Be This Beautiful",
    lines:["When your first snaps came through —","Tania, I genuinely couldn't believe it.","Not just how you looked.","But the way you looked at the camera.","Like you already knew I was on the other side.","Waiting."] },
  { id:"december6", label:"6 December", title:"Against a Wall, at a Wedding, Completely Gone",
    lines:["A relative's wedding.","My battery almost dead.","I found a wall, plugged in, and stood there — charger in hand —","because I couldn't put the phone down.","The shaadi was happening all around me.","And all that existed was you."] },
  { id:"december7", label:"7 December", title:"I'm Madly in Love With You",
    lines:["My cousins were asleep.","I was wide awake.","You kept hinting. I kept asking.","And finally —","\"I'm madly in love with you.\"","Tania, I was on the 7th sky when I read that.","When I finally said it back,","the hours just disappeared.","Because when two people say what they've both been holding —","time does that."] },
  { id:"fights", label:"The Storms", title:"We Fought. We Came Back. Every Time.",
    lines:["There were storms.","Ones that felt like the end.","Three days ago I thought it was over.","I won't pretend otherwise.","But we came back.","We always come back.","And I've stopped seeing that as something to be ashamed of.","Two people who keep choosing each other — that's not weakness.","That's the realest thing I know."] },
  { id:"distance", label:"Seven Months", title:"The City Between Us",
    lines:["Seven months.","Different cities. Cancelled plans. Screens instead of arms.","It has barely happened — once or twice — that 24 hours passed without your voice.","Because even distance couldn't keep us quiet.","I will meet you, Tania.","And when I do —","everything we built in texts and snaps and sleepless nights","will finally have somewhere to land."] },
  { id:"birthday", label:"Today", title:"Happy Birthday, Tania",
    lines:["Today is your birthday.","And I want you to know —","you walked into my life through a language app, a Turkish flag, and a misread reply.","You changed me.","Not slowly. Not gently.","Completely.","I fell in love with the way you say Haazur —","like warmth with a bow, like softness with a spine.","I fell in love with the way you fight like everything is ending","and come back like it never was.","I fell in love with the fact that you almost deleted me","and didn't.","Thank you for not pressing delete.","Thank you for being every version of yourself with me —","the fierce one, the soft one,","the one who sends snaps past midnight,","the one who says things so deeply felt she can't always say them easily.","I want you for the rest of my life.","I will meet you soon.","And I will make every cancelled plan worth the wait.","Happy Birthday, Tania.","You are the most important person to me.","Always."] },
];

const app = document.getElementById("app");
let active = 0, lineIndex = 0, started = false, finished = false;
const revealed = new Array(chapters.length).fill(false);
let timer = null;

// petals
for (let i=0;i<18;i++){
  const p=document.createElement("div");
  p.className="petal";
  p.style.left=(Math.random()*100)+"%";
  const dur=7+Math.random()*8, del=Math.random()*12;
  p.style.transform="rotate("+(Math.random()*360)+"deg)";
  p.style.animation="petalFall "+dur+"s linear "+del+"s infinite";
  app.appendChild(p);
}

function arabic(s){ return /[\u0600-\u06FF]/.test(s); }
function classFor(line){
  if(arabic(line)) return "line arabic";
  if(line==="Always.") return "line always";
  if(line.indexOf("Happy Birthday, Tania")===0 || line==="I want you for the rest of my life.") return "line final-big";
  if(line.indexOf("Tania")>-1 && line.indexOf("Happy")!==0) return "line name-highlight";
  if(line.charAt(0)==='"' || line==="Completely." || line==="Full still." || line==="Waiting.") return "line bold";
  return "line";
}

function renderIntro(){
  const div=document.createElement("div");
  div.className="intro";
  div.innerHTML='<div class="intro-star">✦</div>'+
    '<div class="intro-title">For you,</div>'+
    '<div class="intro-name">Tania</div>'+
    '<div class="intro-sub">A letter in ten moments</div>'+
    '<button class="begin-btn" id="beginBtn">Begin</button>';
  app.appendChild(div);
  document.getElementById("beginBtn").addEventListener("click", start);
}

let mainEl=null;
function renderMain(){
  mainEl=document.createElement("div");
  mainEl.className="main";

  // sidebar
  let sb='<aside class="sidebar"><div class="sb-label">Our Story</div>';
  chapters.forEach(function(ch,i){
    sb+='<div class="ch-row" data-i="'+i+'"><div class="ch-dot"></div><span class="ch-name">'+ch.label+'</span></div>';
  });
  sb+='</aside>';

  // mobile nav
  let mob='<div class="mob-nav">';
  chapters.forEach(function(ch,i){ mob+='<button class="mob-dot" data-mi="'+i+'"></button>'; });
  mob+='</div>';

  mainEl.innerHTML=sb+mob+'<main class="content"><div id="anchor"></div><div class="ch-meta" id="meta"></div><div class="lines" id="lines"></div><div id="finale"></div></main>';
  app.appendChild(mainEl);

  mainEl.querySelectorAll(".ch-row").forEach(function(el){
    el.addEventListener("click", function(){ jump(parseInt(el.getAttribute("data-i"))); });
  });
  mainEl.querySelectorAll(".mob-dot").forEach(function(el){
    el.addEventListener("click", function(){ jump(parseInt(el.getAttribute("data-mi"))); });
  });
}

function updateNav(){
  if(!mainEl) return;
  mainEl.querySelectorAll(".ch-row").forEach(function(el){
    const i=parseInt(el.getAttribute("data-i"));
    el.classList.toggle("open", revealed[i]);
    el.classList.toggle("active", active===i);
  });
  mainEl.querySelectorAll(".mob-dot").forEach(function(el){
    const i=parseInt(el.getAttribute("data-mi"));
    el.classList.toggle("active", active===i);
  });
}

function renderChapter(){
  const ch=chapters[active];
  const meta=document.getElementById("meta");
  meta.innerHTML='<div class="ch-tag">'+ch.label+'</div><h2 class="ch-title">'+ch.title+'</h2><div class="ch-rule"></div>';
  drawLines();
  updateNav();
  const a=document.getElementById("anchor");
  if(a) a.scrollIntoView({behavior:"smooth"});
}

function drawLines(){
  const ch=chapters[active];
  const box=document.getElementById("lines");
  let html="";
  for(let i=0;i<lineIndex && i<ch.lines.length;i++){
    html+='<p class="'+classFor(ch.lines[i])+'" style="animation-delay:'+(i*0.04)+'s">'+ch.lines[i]+'</p>';
  }
  if(!finished && lineIndex<ch.lines.length){ html+='<span class="cursor"></span>'; }
  box.innerHTML=html;
}

function tick(){
  const ch=chapters[active];
  const delay = (active===chapters.length-1) ? 1500 : 1200;
  timer=setTimeout(function(){
    if(lineIndex<ch.lines.length){
      lineIndex++;
      drawLines();
      tick();
    } else {
      const next=active+1;
      if(next<chapters.length){
        active=next; lineIndex=0; revealed[next]=true;
        renderChapter();
        tick();
      } else {
        finished=true;
        drawLines();
        document.getElementById("finale").innerHTML='<div class="finale"><span class="finale-star">✦</span><p class="finale-sub">Written with everything</p></div>';
      }
    }
  }, delay);
}

function jump(i){
  if(!started || !revealed[i]) return;
  clearTimeout(timer);
  active=i; lineIndex=chapters[i].lines.length; finished=false;
  for(let j=0;j<=i;j++) revealed[j]=true;
  renderChapter();
  document.getElementById("finale").innerHTML="";
}

function start(){
  started=true; revealed[0]=true;
  app.innerHTML="";
  // re-add backgrounds + petals
  const gt=document.createElement("div"); gt.className="glow-top"; app.appendChild(gt);
  const gb=document.createElement("div"); gb.className="glow-btm"; app.appendChild(gb);
  for (let i=0;i<18;i++){
    const p=document.createElement("div"); p.className="petal";
    p.style.left=(Math.random()*100)+"%";
    const dur=7+Math.random()*8, del=Math.random()*12;
    p.style.transform="rotate("+(Math.random()*360)+"deg)";
    p.style.animation="petalFall "+dur+"s linear "+del+"s infinite";
    app.appendChild(p);
  }
  renderMain();
  renderChapter();
  tick();
}

renderIntro();
</script>
</body>
</html>
